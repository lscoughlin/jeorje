mcp:
  servers:
    clarity:
      command: clarity
      args: [mcp]
      cwd: ${CWD}
    codegraph:
      command: codegraph
      args: [serve, --mcp]
      cwd: ${CWD}
      timeoutSeconds: 120
permissions:
  rules:
    - tool: ls
      decision: allow
    - tool: mcp__codegraph__codegraph_explore
      decision: allow
    - tool: read
      decision: allow
    - tool: webfetch
      decision: allow
    - tool: patch
      decision: allow
    - tool: write
      decision: allow
    - tool: edit
      decision: allow
    - tool: bash
      decision: allow
